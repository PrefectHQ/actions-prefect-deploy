name: Deploy a Prefect flow
author: PrefectHQ
description: Deploy a flow from a project by creating a Prefect deployment.
branding:
  icon: upload-cloud
  color: blue

inputs:
  deployment-names:
    description:
      Comma separated list of names of your
      Prefect deployments.
      example 'deployment1,deployment2'
    required: false
    default: deployment

  requirements-file-paths:
    description:
      Comma separated list of paths to
      requirements files to correctly install
      dependencies for your Prefect flow(s).
      example './flow1/requirements.txt,./flow2/requirements.txt'
    required: false
    default: ''

  deployment-file-path:
    description:
      Relative path to your Prefect deployment file.
      example './prefect-deployment-files/prefect.yaml'
    required: false
    default: './prefect.yaml'

  pyproject-toml-path:
    description:
      Path to your pyproject.toml file for
      dependency management of your Prefect flow(s).
      example './pyproject.toml'
    required: false
    default: ''

  all-deployments:
    description:
      If set to true, all deployments will be
      deployed. This will override the
      deployment-names input.
    default: "false"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

    - name: Set up environment
      run: uv venv --clear
      shell: bash

    # Inputs reach the scripts below through env, never through ${{ }}
    # interpolation, so a value like a PR title is data and not shell code.
    - id: install-local-requirements
      if: ${{ inputs.requirements-file-paths != '' }}
      env:
        REQUIREMENTS_FILE_PATHS: ${{ inputs.requirements-file-paths }}
      run: |
        IFS=',' read -ra requirements_paths <<< "$REQUIREMENTS_FILE_PATHS"
        for req in "${requirements_paths[@]}"; do
          # Trim surrounding whitespace so 'a.txt, b.txt' installs both files.
          req="${req#"${req%%[![:space:]]*}"}"
          req="${req%"${req##*[![:space:]]}"}"
          if [ -z "$req" ]; then
            continue
          fi
          uv pip install -r "$req"
        done
      shell: bash

    - id: install-from-pyproject-toml
      if: ${{ inputs.pyproject-toml-path != '' }}
      env:
        PYPROJECT_TOML_PATH: ${{ inputs.pyproject-toml-path }}
      run: |
        cd -- "$(dirname -- "$PYPROJECT_TOML_PATH")" || exit 1
        uv pip install .
      shell: bash

    - id: prefect-deploy
      env:
        ALL_DEPLOYMENTS: ${{ inputs.all-deployments }}
        DEPLOYMENT_FILE_PATH: ${{ inputs.deployment-file-path }}
        DEPLOYMENT_NAMES: ${{ inputs.deployment-names }}
      run: |
        uv pip install prefect -U "prefect>=3,<4"
        if [ "$ALL_DEPLOYMENTS" == "true" ];
        then
          uv run prefect --no-prompt deploy --all --prefect-file "$DEPLOYMENT_FILE_PATH"
        else
          IFS=',' read -ra names <<< "$DEPLOYMENT_NAMES"
          for name in "${names[@]}"; do
            # Trim surrounding whitespace so 'a, b' deploys both names.
            name="${name#"${name%%[![:space:]]*}"}"
            name="${name%"${name##*[![:space:]]}"}"
            if [ -z "$name" ]; then
              continue
            fi
            uv run prefect --no-prompt deploy --prefect-file "$DEPLOYMENT_FILE_PATH" --name "$name"
          done
        fi
      shell: bash
